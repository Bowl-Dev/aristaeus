;=====================================================
; MachineControllerOS
;=====================================================

[platformio]
default_envs = esp32_01, esp32_02

[env]
platform = espressif32
;platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.34/platform-espressif32.zip
;espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

build_flags =
    -std=gnu++17
    
lib_ldf_mode = deep+

lib_deps =
    bblanchon/ArduinoJson@^7.4.2
    knolleary/PubSubClient@^2.8
    bogde/HX711@^0.7.5
    madhephaestus/ESP32Servo@^3.0.8

;upload_port = COM4
upload_speed = 115200

[env:esp32_01]
build_flags =
    ${env.build_flags}
    -D DEVICE_ID=\"esp32-01\"
    -D INGREDIENT_ACTUATOR_0=\"rice\"
    -D INGREDIENT_ACTUATOR_1=\"quinoa\"
upload_port = COM6
monitor_port = COM6

[env:esp32_02]
build_flags =
    ${env.build_flags}
    -D DEVICE_ID=\"esp32-02\"
    -D INGREDIENT_ACTUATOR_0=\"carrot\"
    -D INGREDIENT_ACTUATOR_1=\"chicken\"
upload_port = COM4
monitor_port = COM4

; ---------------------------------------------------------------------------
; esp32_03 / esp32_04 - same firmware, synchronized-flush configuration.
;
; Both actuators still dispense in parallel exactly like esp32_01/esp32_02
; (that was never serialized in the first place). The difference is when the
; gates open: here, an actuator that reaches target weight stops its motor
; and waits - gates only open once every actuator that was actively
; dispensing has also finished, and then they open together. See
; SYNCHRONIZED_FLUSH in lib/Core/Config.h and
; MachineController::synchronizeFlush(). If only one actuator has a job, it
; still flushes immediately - the wait only kicks in when a sibling is
; genuinely mid-dispense at the same time.
;
; upload_port/monitor_port are left commented out (auto-detect) since these
; units aren't wired up yet - uncomment and set once you know which COM
; ports they land on. Same for the ingredient names: fill in
; INGREDIENT_ACTUATOR_0/1 once you know what each unit will dispense.
; ---------------------------------------------------------------------------

[env:esp32_03]
build_flags =
    ${env.build_flags}
    -D DEVICE_ID=\"esp32-03\"
    -D SYNCHRONIZED_FLUSH_CONFIG=1
    -D INGREDIENT_ACTUATOR_0=\"corn\"
    -D INGREDIENT_ACTUATOR_1=\"cherryTomato\"
upload_port = COM4
monitor_port = COM4

[env:esp32_04]
build_flags =
    ${env.build_flags}
    -D DEVICE_ID=\"esp32-04\"
    -D SYNCHRONIZED_FLUSH_CONFIG=1
    ;-D INGREDIENT_ACTUATOR_0=\"...\"
    ;-D INGREDIENT_ACTUATOR_1=\"...\"
;upload_port = COM9
;monitor_port = COM9