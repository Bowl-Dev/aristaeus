;=====================================================
; MachineControllerOS
;=====================================================

[platformio]
default_envs = esp32

;-----------------------------------------------------
; Common configuration
;-----------------------------------------------------
[env]
build_flags =
    -std=gnu++17

lib_deps =
    bblanchon/ArduinoJson@^7.4.2
    knolleary/PubSubClient@^2.8
    bogde/HX711@^0.7.5
    madhephaestus/ESP32Servo@^3.0.8

;=====================================================
; ESP32 Firmware
;=====================================================
[env:esp32]

platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

build_flags =
    ${env.build_flags}

;=====================================================
; Native Unit Tests
;=====================================================
[env:native]

platform = native

build_flags =
    ${env.build_flags}

test_framework = doctest

test_build_src = yes
