;=====================================================
; MachineControllerOS
;=====================================================

[platformio]
default_envs = esp32_01, esp32_02

[env]
platform = espressif32
;platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.34/platform-espressif32.zip
;espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

build_flags =
    -std=gnu++17
    
lib_ldf_mode = deep+

lib_deps =
    bblanchon/ArduinoJson@^7.4.2
    knolleary/PubSubClient@^2.8
    bogde/HX711@^0.7.5
    madhephaestus/ESP32Servo@^3.0.8

;upload_port = COM4
upload_speed = 115200

[env:esp32_01]
build_flags =
    ${env.build_flags}
    -D DEVICE_ID=\"esp32-01\"
    -D INGREDIENT_ACTUATOR_0=\"rice\"
    -D INGREDIENT_ACTUATOR_1=\"chicken\"
upload_port = COM4
monitor_port = COM4

[env:esp32_02]
build_flags =
    ${env.build_flags}
    -D DEVICE_ID=\"esp32-02\"
    -D INGREDIENT_ACTUATOR_0=\"carrot\"
    -D INGREDIENT_ACTUATOR_1=\"broccoli\"
upload_port = COM6
monitor_port = COM6