# Deploys the frontend to S3 and invalidates the CloudFront distributions.
#
# Required GitHub repository variables:
#   AWS_REGION            - the region, for example us-east-1
#   WEB_BUCKET            - terraform output web_bucket_name
#   SITE_DISTRIBUTION_ID  - terraform output site_distribution_id
#   ADMIN_DISTRIBUTION_ID - terraform output admin_distribution_id
#
# Required GitHub secret:
#   AWS_ROLE_ARN - the OIDC role, the same one deploy-backend.yml assumes.
#                  The role needs s3:PutObject, s3:DeleteObject and s3:ListBucket on
#                  the bucket, and cloudfront:CreateInvalidation on both distributions.

name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Required for OIDC authentication with AWS

# Allow one deployment at a time
concurrency:
  group: 'frontend-deploy'
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint checks
        run: npm run lint && npm run format:check

      - name: Build frontend
        env:
          # The site serves from the domain root, so the base path is empty.
          BASE_PATH: ''
          # CloudFront proxies /api/* to API Gateway on the same origin.
          # The API client already adds the /api prefix to each endpoint.
          VITE_API_URL: ''
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # SvelteKit gives each asset a content hash, so an asset can cache forever.
      # This pass also deletes an object that the build no longer produces.
      - name: Upload hashed assets
        run: |
          aws s3 sync frontend/build "s3://${{ vars.WEB_BUCKET }}" \
            --delete \
            --exclude "*.html" \
            --cache-control "public, max-age=31536000, immutable"

      # An HTML file keeps its name between builds, so it must revalidate.
      - name: Upload HTML
        run: |
          aws s3 sync frontend/build "s3://${{ vars.WEB_BUCKET }}" \
            --exclude "*" \
            --include "*.html" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.SITE_DISTRIBUTION_ID }}" \
            --paths "/*"
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.ADMIN_DISTRIBUTION_ID }}" \
            --paths "/*"
